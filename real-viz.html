<style>
  /* 主题对齐 b19：浅色工业后台（白底 + #0067CC 蓝 + #F2F6FA 页面背景） */
  :root{
    --page-bg:#F2F6FA; --panel:#FFFFFF; --panel-soft:#F3F7FB;
    --border:#DBDEE3; --border-input:#AAAAAA;
    --text:#333333; --text-strong:#181818; --text-dim:#666666;
    --primary:#0067CC; --primary-light:#3399FF; --primary-dark:#00488F;
    --accent-bg:#DCEFFF; --row-hover:#DCEFFF;
    --danger:#D50201; --success:#2e7d32; --warn:#e67e22;
    --radius:4px; --shadow:0 0 4px 0 rgba(0,0,0,0.1);
    --font:"Microsoft YaHei","Microsoft YaHei-Bold",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--page-bg);color:var(--text);height:100vh;overflow:hidden;font-size:12px}

  /* 顶部导航（b19 风格：白底 + 阴影 + 主色选中） */
  
  
  .topbar a{color:var(--text-dim);text-decoration:none;padding:6px 14px;border-radius:var(--radius);font-size:13px}
  .topbar a:hover{color:var(--primary);background:var(--accent-bg)}
  .topbar a.active{background:var(--primary);color:#fff}
  
  

  .main{display:flex;height:calc(100vh - 40px)}

  /* 左侧拓扑区（浅灰底） */
  .left{flex:1;position:relative;background:#EEF2F7;overflow:hidden;border-right:1px solid var(--border)}
  .left svg{width:100%;height:100%;display:block}

  /* 右侧面板（白卡片） */
  .right{width:340px;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
  .rhead{padding:10px 14px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#EDF4FF 0%,#D0DCEB 100%)}
  .rhead h3{font-size:14px;color:var(--text-strong);margin-bottom:2px}
  .rhead .sub{color:var(--text-dim);font-size:11px}
  .ctrls{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;background:var(--panel-soft)}
  .ctrl-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim)}
  .ctrl-row label{white-space:nowrap;min-width:64px;color:var(--text)}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font);font-size:12px;font-weight:bold;height:28px;min-width:auto;padding:0 10px;border-radius:4px;cursor:pointer;border:1px solid #D0D4DF;background-image:linear-gradient(180deg,#FFFFFF 0%,#E0E6F2 100%);box-shadow:inset 0 -2px 0 0 #D0D4DF;color:#000;transition:filter 0.15s}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn.active{background:linear-gradient(180deg,#3399FF 0%,#0067CC 100%);color:#fff;border-color:var(--primary-dark);font-weight:bold}
  .btns{display:flex;gap:4px;flex-wrap:wrap}
  input[type=range]{accent-color:var(--primary);width:100%}
  .rbody{flex:1;overflow-y:auto;padding:10px 14px}
  .rbody::-webkit-scrollbar{width:6px}
  .rbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  .stat{display:flex;gap:16px;padding:8px 0 10px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .stat .item{color:var(--text-dim);font-size:11px}
  .stat .item b{color:var(--primary);font-size:16px;display:block;font-family:var(--font)}

  .edge-row{display:flex;justify-content:space-between;align-items:center;padding:5px 4px;border-bottom:1px solid #f0f2f5;font-size:11px;cursor:pointer}
  .edge-row:hover{background:var(--row-hover)}
  .edge-row .route{font-family:Consolas,monospace;font-size:10px;color:var(--text)}
  .edge-row .cnt{font-weight:bold;color:var(--primary)}
  .swatch{display:inline-block;width:16px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle}

  /* 图例（浅色卡片，无 backdrop-blur） */
  .legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px 10px;font-size:11px}
  .legend .lt{color:var(--text-dim);font-size:10px;margin-bottom:4px}
  .legend .bar{width:180px;height:9px;border-radius:2px;margin:2px 0;border:1px solid var(--border)}
  .legend .scale{display:flex;justify-content:space-between;color:var(--text-dim);font-size:9px}

  .badge{position:absolute;right:14px;top:14px;background:var(--accent-bg);border:1px solid var(--primary);color:var(--primary);padding:3px 12px;border-radius:12px;font-size:11px}

  /* 真实SVG节点配色（浅色背景下，用 b19 主色系 + 设备语义色，保证对比度） */
  #bg-layer .stocker-body{fill:#0067CC !important;stroke:#3399FF !important;stroke-width:0.4 !important}
  #bg-layer .lift-body{fill:#7b1fa2 !important;stroke:#ba68c8 !important;stroke-width:0.4 !important}
  #bg-layer .mifa-body{fill:#e67e22 !important;stroke:#ffb74d !important;stroke-width:0.4 !important}
  #bg-layer .area-node{fill:#00838f !important;stroke:#4dd0e1 !important;stroke-width:0.35 !important}
  #bg-layer .port-node{fill:#2e7d32 !important;stroke:#81c784 !important;stroke-width:0.3 !important}
  #bg-layer .equipment-group text{fill:#181818 !important;font-weight:bold !important}
  #bg-layer text{fill:#333333 !important}
</style>
</head>
<body>

  <a class="active">真实数据</a>
  <div class="sp"></div>
  <span class="meta">142,712 任务 · 368 边 · 188 节点</span>
</div>
<div class="main">
  <div class="left">
    <svg id="svg" viewBox="0 0 297 210" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="badge" id="modeBadge">直方图均衡化 + Viridis</div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="right">
    <div class="rhead">
      <h3>历史压力分析</h3>
      <div class="sub">数据源：PG staging_macro · 2026-04-30 ~ 05-09</div>
    </div>
    <div class="ctrls">
      <div class="ctrl-row">
        <label>染色</label>
        <div class="btns">
          <button class="btn active" data-cm="he" onclick="setCM('he')">直方图均衡化</button>
          <button class="btn" data-cm="linear" onclick="setCM('linear')">线性</button>
          <button class="btn" data-cm="log" onclick="setCM('log')">log</button>
        </div>
      </div>
      <div class="ctrl-row">
        <label>双向边</label>
        <div class="btns">
          <button class="btn active" data-bd="arrow" onclick="setBD('arrow')">静态箭头</button>
          <button class="btn" data-bd="parallel" onclick="setBD('parallel')">平行双线</button>
          <button class="btn" data-bd="net" onclick="setBD('net')">仅净流向</button>
        </div>
      </div>
      <div class="ctrl-row">
        <label>最低频次 <span id="thVal" style="color:var(--primary);font-weight:bold">≥50</span></label>
        <input type="range" id="thresh" min="0" max="3000" value="50" oninput="onThresh(this.value)"/>
      </div>
      <div class="ctrl-row">
        <label>显示</label>
        <div class="btns">
          <button class="btn active" data-sh="all" onclick="setShow('all')">全部 <span id="cntAll">0</span></button>
          <button class="btn" data-sh="bidir" onclick="setShow('bidir')">仅双向 <span id="cntBidir">0</span></button>
        </div>
      </div>
    </div>
    <div class="rbody">
      <div class="stat">
        <div class="item">显示边<b id="sShow">0</b></div>
        <div class="item">双向对<b id="sPair">0</b></div>
        <div class="item">节点<b id="sNode">0</b></div>
        <div class="item">未映射<b id="sUnmapped" style="color:var(--danger)">0</b></div>
      </div>
      <div id="edgeList"></div>
    </div>
  </div>
</div>

<script>
let EDGES=[], LAYOUT={}, curCM='he', curBD='arrow', curShow='all', thresh=50;

const VIR=[[68,1,84],[71,40,120],[62,74,137],[49,104,142],[38,130,142],[31,158,137],[53,183,121],[110,205,81],[181,222,43],[253,231,37]];
function vir(t){t=Math.max(0,Math.min(1,t));const i=t*(VIR.length-1),i0=Math.floor(i),i1=Math.min(VIR.length-1,i0+1),f=i-i0,c0=VIR[i0],c1=VIR[i1];return `rgb(${Math.round(c0[0]+(c1[0]-c0[0])*f)},${Math.round(c0[1]+(c1[1]-c0[1])*f)},${Math.round(c0[2]+(c1[2]-c0[2])*f)})`;}

let CDF_MAP={};
function buildCDF(){
  const counts=[...new Set(EDGES.map(e=>e.count))].sort((a,b)=>a-b);
  CDF_MAP={_sorted:counts};
  counts.forEach((c,i)=>{CDF_MAP[c]=(i+1)/counts.length;});
}
function cdfVal(c){
  if(c in CDF_MAP) return CDF_MAP[c];
  const s=CDF_MAP._sorted;let lo=0,hi=s.length;
  while(lo<hi){const mid=(lo+hi)>>1;if(s[mid]<=c)lo=mid+1;else hi=mid;}
  return lo/s.length;
}
function colorOf(e){
  const c=e.count,mx=CDF_MAP._mx;
  let t;
  if(curCM==='linear')t=c/mx;
  else if(curCM==='log')t=Math.log(1+c)/Math.log(1+mx);
  else t=cdfVal(c);
  return vir(t);
}

async function init(){
  const [eRes,lRes,svgText]=await Promise.all([
    fetch('assets/real_edges.json').then(r=>r.json()),
    fetch('assets/real_layout.json').then(r=>r.json()),
    fetch('assets/mcs_layout_min.svg').then(r=>r.text())
  ]);
  EDGES=eRes.edges;
  LAYOUT=lRes;
  CDF_MAP._mx=Math.max(...EDGES.map(e=>e.count));
  const svg=document.getElementById('svg');
  const parser=new DOMParser();
  const doc=parser.parseFromString(svgText,'image/svg+xml');
  const srcSvg=doc.querySelector('svg');
  const bg=mk('g',{id:'bg-layer'});bg.setAttribute('opacity','0.9');
  [...srcSvg.children].forEach(c=>bg.appendChild(c));
  svg.appendChild(bg);
  buildCDF();
  document.getElementById('cntAll').textContent=EDGES.length;
  const pairs={};
  EDGES.forEach(e=>{const k=[e.from,e.to].sort().join('|');(pairs[k]=pairs[k]||[]).push(e);});
  document.getElementById('cntBidir').textContent=Object.values(pairs).filter(v=>v.length>=2).length;
  render();
}

const NS='http://www.w3.org/2000/svg';
function mk(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}

function render(){
  const svg=document.getElementById('svg');
  ['edge-layer','unmapped-layer'].forEach(id=>{const el=svg.querySelector('#'+id);if(el)el.remove();});

  let edges=EDGES.filter(e=>e.count>=thresh);
  const pairs={};
  edges.forEach(e=>{const k=[e.from,e.to].sort().join('|');(pairs[k]=pairs[k]||[]).push(e);});
  if(curShow==='bidir'){
    const bk=new Set(Object.entries(pairs).filter(([k,v])=>v.length>=2).map(([k])=>k));
    edges=edges.filter(e=>bk.has([e.from,e.to].sort().join('|')));
  }

  const nodeSet=new Set();
  edges.forEach(e=>{nodeSet.add(e.from);nodeSet.add(e.to);});

  const eg=mk('g',{id:'edge-layer'});
  const renderedKeys=new Set();
  let unmappedCount=0;
  edges.forEach(e=>{
    const p1=LAYOUT[e.from],p2=LAYOUT[e.to];
    if(!p1||!p2){unmappedCount++;return;}
    const key=[e.from,e.to].sort().join('|');
    const pair=pairs[key]||[];
    const isBidir=pair.length>=2;
    if(curBD==='net'&&isBidir){
      if(renderedKeys.has(key))return;
      renderedKeys.add(key);
      const dominant=pair.reduce((a,b)=>a.count>b.count?a:b);
      drawEdge(eg,dominant,colorOf(dominant),0,true);
    } else if(curBD==='arrow'){
      drawEdge(eg,e,colorOf(e),isBidir?1.2:0,true);  // 静态箭头，无动画
    } else {
      drawEdge(eg,e,colorOf(e),isBidir?1.2:0,false);
    }
  });
  svg.appendChild(eg);

  if(unmappedCount>0){
    const ul=mk('g',{id:'unmapped-layer'});
    const badge=mk('text',{x:290,y:10,'text-anchor':'end',fill:'#D50201','font-size':3.5,'font-weight':'bold'});
    badge.textContent=`${unmappedCount} 边未映射`;
    ul.appendChild(badge);
    svg.appendChild(ul);
  }

  document.getElementById('sShow').textContent=edges.length;
  document.getElementById('sPair').textContent=Object.values(pairs).filter(v=>v.length>=2).length;
  document.getElementById('sNode').textContent=nodeSet.size;
  document.getElementById('sUnmapped').textContent=unmappedCount;

  const list=document.getElementById('edgeList');
  const top=[...edges].sort((a,b)=>b.count-a.count).slice(0,15);
  list.innerHTML='<div style="color:var(--text-strong);font-size:12px;margin-bottom:6px;font-weight:bold">高频边 Top 15</div>'+top.map(e=>{
    const c=colorOf(e);
    return `<div class="edge-row"><span><span class="swatch" style="background:${c}"></span><span class="route">${e.from} → ${e.to}</span></span><span class="cnt">${e.count}</span></div>`;
  }).join('');
  renderLegend();
}

function drawEdge(g,e,color,offset,withArrow){
  const p1=LAYOUT[e.from],p2=LAYOUT[e.to];if(!p1||!p2)return;
  let x1=p1.x,y1=p1.y,x2=p2.x,y2=p2.y;
  if(offset){const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);if(len===0)return;const nx=-dy/len,ny=dx/len;x1+=nx*offset;y1+=ny*offset;x2+=nx*offset;y2+=ny*offset;}
  // 线宽按频次（log 缩放，更细但高不透明度保证清晰）
  const w=Math.max(0.06,Math.log(1+e.count)/Math.log(1+100)*0.25);
  const path=mk('path',{d:`M${x1} ${y1} L${x2} ${y2}`,stroke:color,'stroke-width':w,fill:'none',opacity:0.92,'stroke-linecap':'round'});
  g.appendChild(path);
  // 静态箭头（线终点处的三角形，指向终点方向）—— quieter：无动画
  if(withArrow){
    const ang=Math.atan2(y2-y1,x2-x1);
    // 箭头退到线终点前一点，避免压住节点
    const ax=x2-1.2*Math.cos(ang),ay=y2-1.2*Math.sin(ang);
    const ar=0.7;
    const tri=mk('polygon',{
      points:`${ax+ar*Math.cos(ang)},${ay+ar*Math.sin(ang)} ${ax-ar*0.6*Math.cos(ang)-ar*0.6*Math.sin(ang)},${ay-ar*0.6*Math.sin(ang)+ar*0.6*Math.cos(ang)} ${ax-ar*0.6*Math.cos(ang)+ar*0.6*Math.sin(ang)},${ay-ar*0.6*Math.sin(ang)-ar*0.6*Math.cos(ang)}`,
      fill:color,opacity:0.92
    });
    g.appendChild(tri);
  }
}

function renderLegend(){
  const lg=document.getElementById('legend');
  const grad='linear-gradient(90deg,'+VIR.map((c,i)=>`rgb(${c[0]},${c[1]},${c[2]}) ${(i/(VIR.length-1)*100).toFixed(0)}%`).join(',')+')';
  const mx=CDF_MAP._mx;
  const label={he:'频次（均衡化，刻度均匀）',linear:`频次 1 ~ ${mx}（线性）`,log:`频次 1 ~ ${mx}（log）`}[curCM];
  lg.innerHTML=`<div class="lt">${{he:'直方图均衡化',linear:'线性',log:'log变换'}[curCM]} + Viridis</div>
    <div class="bar" style="background:${grad}"></div>
    <div class="scale"><span>低</span><span>${label}</span><span>高</span></div>`;
}

function setCM(m){curCM=m;document.querySelectorAll('[data-cm]').forEach(b=>b.classList.toggle('active',b.dataset.cm===m));document.getElementById('modeBadge').textContent={he:'直方图均衡化 + Viridis',linear:'线性 + Viridis',log:'log + Viridis'}[m];render();}
function setBD(m){curBD=m;document.querySelectorAll('[data-bd]').forEach(b=>b.classList.toggle('active',b.dataset.bd===m));render();}
function setShow(m){curShow=m;document.querySelectorAll('[data-sh]').forEach(b=>b.classList.toggle('active',b.dataset.sh===m));render();}
function onThresh(v){thresh=+v;document.getElementById('thVal').textContent='≥'+v;render();}

init();
</script>
</body>
